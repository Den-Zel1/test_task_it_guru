version: '3.8'

services:
  db:
    image: postgres:15
    container_name: it_guru_db
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    # Ограничение потребления ресурсов контейнером базы
    deploy:
      resources:
        limits:
          memory: 512M
    # Настройка ротации логов (защита диска от переполнения)
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: fastapi_service
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    # Ограничение потребления ресурсов контейнером приложения
    deploy:
      resources:
        limits:
          memory: 256M
    # Настройка ротации логов для приложения
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
